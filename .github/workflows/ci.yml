# 푸시와 PR마다 API 테스트 · DB 권한 테스트 · 웹 빌드를 돌린다.
# main 에서 모두 통과하면 'API 배포'가 Render 배포 주소(Deploy Hook, 저장소 비밀값 RENDER_DEPLOY_HOOK_URL)로 이 커밋을 배포하고,
# /healthz 의 version 이 이 커밋이 될 때까지 기다린다. Render 쪽 Auto-Deploy 는 끈다(Off).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q

  web:
    name: DB 권한 테스트 · 웹 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: DB 권한 테스트 (PGlite)
        working-directory: .
        run: |
          node tests/auth/rls.mjs
          node tests/auth/origin.mjs
      - run: npx tsc --noEmit -p .
      - name: 웹 빌드
        run: npx next build
        env:
          # 빌드만 확인한다. 실제 키는 쓰지 않는다.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          PASSO_API_URL: http://localhost:8003

  deploy:
    name: API 배포
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Render에 이 커밋 배포 요청
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_URL 이 없어 API 배포를 건너뛰어요"; exit 0; fi
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$HOOK&ref=$GITHUB_SHA")
          echo "Render 응답 $code"
          [ "$code" = 200 ] || [ "$code" = 202 ] || { echo "::error::Render가 배포 요청을 받지 않았어요 ($code)"; exit 1; }
      - name: 새 코드가 뜰 때까지 기다리기
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          [ -n "$HOOK" ] || exit 0
          want=${GITHUB_SHA:0:7}
          for i in $(seq 1 60); do
            got=$(curl -sS --max-time 90 https://passo-dev-api.onrender.com/healthz | python3 -c 'import sys,json; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            echo "지금 운영: ${got:-?} / 기다리는 것: $want"
            [ "$got" = "$want" ] && exit 0
            sleep 15
          done
          echo "::error::15분 안에 새 코드가 뜨지 않았어요. Render Events 를 확인해 주세요"; exit 1
