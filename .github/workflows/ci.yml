# 푸시와 PR마다 API 테스트 · DB 권한 테스트 · 웹 빌드를 돌린다.
# Render의 Auto-Deploy를 "After CI Checks Pass"로 두면 여기가 모두 통과한 커밋만 배포된다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q

  web:
    name: DB 권한 테스트 · 웹 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: DB 권한 테스트 (PGlite)
        working-directory: .
        run: |
          node tests/auth/rls.mjs
          node tests/auth/origin.mjs
      - run: npx tsc --noEmit -p .
      - name: 웹 빌드
        run: npx next build
        env:
          # 빌드만 확인한다. 실제 키는 쓰지 않는다.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          PASSO_API_URL: http://localhost:8003
