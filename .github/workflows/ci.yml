# 푸시와 PR마다 API 테스트 · DB 권한 테스트 · 웹 빌드를 돌린다.
# main 에서 모두 통과하면 'API 배포 (Cloud Run)'이 이 커밋의 API 를 도쿄 Cloud Run 에 배포하고, /health 의 version 이 이 커밋이 될 때까지 기다린다.
# 저장소 변수 GCP_PROJECT · GCP_SERVICE_ACCOUNT · GCP_WIF_PROVIDER 가 있어야 돈다(deploy/cloud-run-setup.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # 코드를 바꾸지 않고 다시 배포할 때(Actions 화면의 Run workflow)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q

  web:
    name: DB 권한 테스트 · 웹 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: DB 권한 테스트 (PGlite)
        working-directory: .
        run: |
          node tests/auth/rls.mjs
          node tests/auth/origin.mjs
      - run: npx tsc --noEmit -p .
      - name: 웹 빌드
        run: npx next build
        env:
          # 빌드만 확인한다. 실제 키는 쓰지 않는다.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          PASSO_API_URL: http://localhost:8003


  cloudrun:
    name: API 배포 (Cloud Run)
    needs: [api, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # 키 파일 없이 Google Cloud 에 들어간다(Workload Identity Federation)
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/passo/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 컨테이너 만들어 올리기
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker build -f backend/Dockerfile --target api -t "$IMAGE" .
          docker push "$IMAGE"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: passo-api
          region: asia-northeast1
          image: ${{ env.IMAGE }}
          # 키(SUPABASE_* · RUNYOUR_API_KEY · ADMIN_EMAILS)는 Cloud Run 화면에서 한 번 넣는다. 여기서 넣는 값과 합쳐지고 지워지지 않는다
          env_vars: |
            APP_VERSION=${{ github.sha }}
            TZ=Asia/Seoul
          flags: --allow-unauthenticated --cpu=1 --memory=1Gi --cpu-boost --timeout=300 --min-instances=0 --max-instances=2 --concurrency=40
      - name: 새 코드가 떴는지 보기
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          got=$(curl -sS --max-time 60 "$URL/health" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("version",""))')  # /healthz 는 Cloud Run 이 막아 둔 주소
          echo "Cloud Run: $got / 이 커밋: ${GITHUB_SHA:0:7} / 주소: $URL"
          [ "$got" = "${GITHUB_SHA:0:7}" ]
