# 푸시와 PR마다 API 테스트 · DB 권한 테스트 · 웹 빌드를 돌린다.
# main 에서 모두 통과하면 이 커밋의 API 를 배포하고, /healthz 의 version 이 이 커밋이 될 때까지 기다린다.
# - 'API 배포 (Cloud Run)': 저장소 변수 GCP_PROJECT · GCP_SERVICE_ACCOUNT · GCP_WIF_PROVIDER 가 있으면(deploy/cloud-run-setup.sh) 도쿄 Cloud Run 에
# - 'API 배포': 저장소 비밀값 RENDER_DEPLOY_HOOK_URL 이 있으면 Render Deploy Hook 으로(Render 쪽 Auto-Deploy 는 Off)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # 코드를 바꾸지 않고 다시 배포할 때(Actions 화면의 Run workflow)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q

  web:
    name: DB 권한 테스트 · 웹 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: DB 권한 테스트 (PGlite)
        working-directory: .
        run: |
          node tests/auth/rls.mjs
          node tests/auth/origin.mjs
      - run: npx tsc --noEmit -p .
      - name: 웹 빌드
        run: npx next build
        env:
          # 빌드만 확인한다. 실제 키는 쓰지 않는다.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          PASSO_API_URL: http://localhost:8003

  deploy:
    name: API 배포
    needs: [api, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Render에 이 커밋 배포 요청
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_URL 이 없어 API 배포를 건너뛰어요"; exit 0; fi
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$HOOK&ref=$GITHUB_SHA")
          echo "Render 응답 $code"
          [ "$code" = 200 ] || [ "$code" = 202 ] || { echo "::error::Render가 배포 요청을 받지 않았어요 ($code)"; exit 1; }
      - name: 새 코드가 뜰 때까지 기다리기
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          [ -n "$HOOK" ] || exit 0
          want=${GITHUB_SHA:0:7}
          for i in $(seq 1 60); do
            got=$(curl -sS --max-time 90 https://passo-dev-api.onrender.com/healthz | python3 -c 'import sys,json; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            echo "지금 운영: ${got:-?} / 기다리는 것: $want"
            [ "$got" = "$want" ] && exit 0
            sleep 15
          done
          echo "::error::15분 안에 새 코드가 뜨지 않았어요. Render Events 를 확인해 주세요"; exit 1

  cloudrun:
    name: API 배포 (Cloud Run)
    needs: [api, web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # 키 파일 없이 Google Cloud 에 들어간다(Workload Identity Federation)
    env:
      IMAGE: asia-northeast1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/passo/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 컨테이너 만들어 올리기
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          docker build -f backend/Dockerfile --target api -t "$IMAGE" .
          docker push "$IMAGE"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: passo-api
          region: asia-northeast1
          image: ${{ env.IMAGE }}
          # 키(SUPABASE_* · RUNYOUR_API_KEY · ADMIN_EMAILS)는 Cloud Run 화면에서 한 번 넣는다. 여기서 넣는 값과 합쳐지고 지워지지 않는다
          env_vars: |
            APP_VERSION=${{ github.sha }}
            TZ=Asia/Seoul
          flags: --allow-unauthenticated --cpu=1 --memory=1Gi --cpu-boost --timeout=300 --min-instances=0 --max-instances=2 --concurrency=40
      - name: 새 코드가 떴는지 보기
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          got=$(curl -sS --max-time 60 "$URL/healthz" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("version",""))')
          echo "Cloud Run: $got / 이 커밋: ${GITHUB_SHA:0:7} / 주소: $URL"
          [ "$got" = "${GITHUB_SHA:0:7}" ]
